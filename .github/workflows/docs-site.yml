name: Documentation site

on:
  push:
    branches:
      - main
    paths:
      - 'docs/**'
      - 'packages/*/README.md'
      - 'README.md'
      - 'docs-site/**'
      - '.github/workflows/docs-site.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: docs-site/package-lock.json

      - name: Build documentation site
        env:
          # Inlay is a project Pages site (`InlayPHP/inlay`), so generated
          # links must include the repository path. Remove this variable when
          # switching Pages to an organization site or custom domain.
          DOCS_BASE_PATH: /inlay
        run: npm ci --prefix docs-site && npm run build --prefix docs-site

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs-site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
